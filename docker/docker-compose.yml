services:
  frontend:
    container_name: journo-frontend
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

  backend:
    container_name: journo-backend
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ./.env.localhost
    environment:
      GIN_MODE: release # Set debug for debug
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: disable
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    container_name: journo-postgres
    image: postgres:17-alpine
    env_file:
      - ./.env.localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
